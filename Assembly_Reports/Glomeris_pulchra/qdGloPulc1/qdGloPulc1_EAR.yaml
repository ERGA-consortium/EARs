Curator notes:
  Interventions/Gb: 29
  Contamination notes: '"Repeated attempts to run BlobTools were unsuccessful, so
    we used an alternative tool called FCS-GX (Foreign Contamination Screen _ Genome
    eXclusion), to identify contaminated scaffolds. In this species, the -alt- includes
    85 contaminated scaffolds with diverse bacterial sequences. Of these, four scaffolds
    exceeded 1 Mbp. The -prim- assembly contains 3 contaminated scaffolds. All contaminated
    scaffolds from both haps were flagged as contaminants during a preliminary curation
    step using pretextview, and were subsequently removed from the analysis in the
    pretextview file shared for review."'
  Other observations: '"We generated a new diploid assembly of Glomeris pulchra from
    scratch. During initial trials, hifiasm failed to correctly identify the heterozygous
    and homozygous coverage peaks, producing assemblies with an inflated number of
    duplicated BUSCOs. To stabilize the assembly graph, we re-ran hifiasm with a manually
    specified homozygous coverage value (hom_cov = 86), matching the homozygous peak
    predicted by GenomeScope2 for the ONT read set. This adjustment substantially
    improved the assembly: duplicated BUSCOs were nearly eliminated, and no additional
    purge_dups step was required. We then curated the assembly in diploid mode. Because
    the Hi-C dataset was of relatively poor quality: approximately 68% of Hi-C reads
    did not map to the assembly. And because one haplotype (hap1) was noticeably more
    fragmented than the other, we prioritized optimizing the more contiguous haplotype
    (hap2). Several contigs originally assigned to hap1 were reassigned to hap2 when
    their structure and Hi-C signal supported this, and hap2 was designated as the
    primary assembly (pri or hap1 for compatibility with the EAR nomenclature). Hap1
    was retained as the alternative assembly (alt or hap2). After curation, both the
    primary and alternative assemblies showed substantial improvements in contiguity,
    reflected in higher cN50 and sN50 values. Merqury QV scores also increased for
    both haplotypes (due to a bug in the EAR generating script only the QV of the
    prim/hap1 is shown at the report table), indicating improved consensus accuracy.
    The final Pretext maps for each assembly underwent two rounds of internal review,
    and save_state files have been provided for both assemblies. Finally,to evaluate
    whether the two G. pulchra samples (GP7 and GP16) belonged to the same species
    and to identify the most suitable assembly for downstream curation, we compared
    them using HoBRAC and Mash. HoBRAC performs reference-free structural validation
    by combining whole-genome alignment, BUSCO-anchored synteny, and reference ranking
    to detect misassemblies, large-scale rearrangements, and haplotig artifacts, while
    Mash estimates genomic relatedness by rapidly comparing the k-mer sketches of
    two assemblies to compute an approximate evolutionary distance. Synteny analysis
    in HoBRAC showed strong chromosome-level collinearity between GP7 and GP16, and
    Mash reported a very small inter-assembly distance (0.0119), consistent with two
    individuals from the same species. BUSCO profiles were similarly high for both
    assemblies, with GP7 showing fewer duplicated BUSCOs and GP16 exhibiting a larger
    assembly size due to increased repeat content. Because the Hi-C library mapped
    poorly to GP16 (78% unmapped reads), only GP7 was curated further, and GP16 was
    retained as an uncurated but biologically validated conspecific assembly."'

