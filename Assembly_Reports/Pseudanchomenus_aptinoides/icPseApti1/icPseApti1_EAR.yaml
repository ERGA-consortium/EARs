Curator notes:
  Interventions/Gb: 278
  Contamination notes: '""'
  Other observations: '"The assembly of Pseudanchomenus aptinoides (icPseApti1) is
    based on 33X PacBio data and 181X Arima Hi-C data generated as part of the European
    Reference Genome Atlas (ERGA, https://www.erga-biodiversity.eu/) via the Biodiversity
    Genomics Europe project (BGE, https://biodiversitygenomics.eu/). The assembly
    process included the following steps: initial PacBio assembly generation with
    Hifiasm, removal of contaminant sequences using Context, removal of haplotypic
    duplications using purge_dups, and Hi-C-based scaffolding with YaHS. In total,
    35 contigs were identified as contaminants (bacterial, archaeal, or viral), totaling
    9.446 Mb (with the largest being 4.384 Mb). Additionally, 1145 regions totaling
    121.128 Mb (with the largest being 0.567 Mb) were identified as haplotypic duplications
    and removed. The mitochondrial genome was assembled using OATK. Finally, the primary
    assembly was analyzed and manually improved using Pretext. During manual curation,
    11 haplotypic regions were removed, totaling 8.298Mb , (with the largest being
    1.993Mb).Chromosome-scale scaffolds confirmed by Hi-C data were named in order
    of size.Scaffolds 700 through 710 were initially included in the assembly, but
    they turned out to be repeated sequences, which is why it was decided to leave
    them as unplaced sequences"'

