Curator notes:
  Interventions/Gb: 36
  Contamination notes: '"FCS-GX detected several bacteria and proteobacteria hits.
    430 contigs (43Mb) were removed. Mitochondrial hits were removed"'
  Other observations: '"PacBio reads were assembled with hifiasm (HiC-mode, primary
    collapsed assembly selected). FCS-GX detected several contaminations. Purge_dups
    was run in default mode but removed more than 25% of content - primarily due to
    REPEAT-tagged sequences. Therefore the purging was done manually by filtering
    contigs based on mitohifi, btk, purge_dups and BUSCO results. Tiara was not used
    at this point, as the classification failed for the crayfish. Yahs was used in
    default mode to scaffold the contigs. Manual curation was done with PretextView.
    In a first round the scaffolds were roughly assigned to chromosomes and the remaining
    duplications were removed (~800Mb). The HiC Map was recreated for a second curation
    round. I ended up with 90 chromosomes, but I am not sure if that is correct. The
    genome is very repetitive and also shows several off-diagonal signals. Most of
    them repeat-induced. SUPER_18 and SUPER_24 show a strong signal. According to
    the literature Austropotamobius torrentium should have 88 chromosomes. I am open
    for any suggestions."'

